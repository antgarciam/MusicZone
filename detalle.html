<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="detalleStyle.css">
</head>
<body>

<div class="position-absolute top-0 start-0 m-3" style="z-index: 1050;">
    <a href="catalogo.html" class="btn btn-outline-dark text-white d-flex align-items-center gap-2 fw-bold shadow-sm bg-dark w-100 text-decoration-none">
        ⬅️ Volver al catálogo
    </a>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 border-0 text-center" style="max-width: 400px; width: 100%; border-radius: 12px;">
        
        <h5 class="fw-bold border-bottom pb-2 mb-3 text-secondary">Detalle del producto</h5>
        
        <div class="bg-light p-3 mb-3 rounded d-flex justify-content-center align-items-center" style="min-height: 200px;">
            <img id="imagen" src="" class="img-fluid rounded" alt="Cargando instrumento...">
        </div>
        
        <div class="card-body p-0">
            <h4 class="card-title fw-bold" id="nombre">Cargando nombre...</h4>
            <p class="card-text text-success fw-bold fs-5 my-2" id="precio">Cargando precio...</p>
            <p class="card-text text-muted text-start fs-6" id="descripcion">Cargando descripción...</p>
        </div>
        
    </div>
</div>

    <br>

    <a href="catalogo.html"></a>


    <script src="detalle.js"></script>

</body>
</html>
