<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicZone🎵 - Administración</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="adminStyle.css">
</head>
<body class="position-relative">

    <header class="bg-dark text-white py-3 shadow-sm mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="fs-3 fw-bold m-0">Panel de Administración ⚙️</h1>
            <a href="inicio.html" class="btn btn-outline-danger fw-bold px-3">Cerrar Sesión</a>
        </div>
    </header> 

    <div class="container my-5 bg-white p-4 rounded-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <div>
                <h1 class="fw-bold text-dark m-0">Panel de Control</h1>
                <p class="text-muted m-0">Bienvenido Jefazo, aquí puedes gestionar el inventario de MusicZone</p>
            </div>
            <span class="badge bg-danger fs-6 px-3 py-2 rounded-pill">Rol: Administrador</span>
        </div>

        <h3 class="fw-bold mb-3 text-secondary">Inventario Actual</h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle bg-light rounded shadow-sm overflow-hidden">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" style="width: 80px;">Vista</th>
                        <th scope="col">Producto</th>
                        <th scope="col">Descripción</th>
                        <th scope="col" style="width: 130px;">Precio</th>
                        <th scope="col" class="text-center" style="width: 200px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos-admin">
                </tbody>
            </table>
        </div>
    </div>

    <script src="catalogo.js"></script>
</body>
</html>
